<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="SecureBank">
  <title>SecureBank</title>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A6B"/>
      <stop offset="0.55" stop-color="#12608F"/>
      <stop offset="1" stop-color="#0FA3A3"/>
    </linearGradient>
  </defs>

  <!-- Shield silhouette. Squared shoulders and a wide body so the mark still
       reads as a shield when the browser scales it down to 16px. -->
  <path fill="url(#shield)"
        d="M16 2.2 L27.6 6.6 V15.4 C27.6 22.5 22.6 27.7 16 29.9
           C9.4 27.7 4.4 22.5 4.4 15.4 V6.6 Z"/>

  <!-- Keyhole in negative space: the lock motif, cut large enough to survive
       downscaling. Circle and stem overlap so they render as one shape. -->
  <circle cx="16" cy="13.1" r="3.35" fill="#FFFFFF"/>
  <path fill="#FFFFFF" d="M13.95 15.6 L18.05 15.6 L19.15 22.3 L12.85 22.3 Z"/>
</svg>
